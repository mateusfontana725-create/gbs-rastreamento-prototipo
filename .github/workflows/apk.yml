name: Aplicativo Android (APK)

# Gera o APK do participante (android/) e publica no Release "app-android" do repositório,
# de onde o botão "Baixar aplicativo" da página do participante baixa (/api/app?baixar=1).
on:
  push:
    branches: [main, v3-apk]
    paths:
      - 'android/**'
      - 'public/js/gps.js'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Filtro do GPS do aplicativo igual ao da página
        run: node testes/app_nativo.test.js

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_CHAVE_ALIAS: ${{ secrets.ANDROID_CHAVE_ALIAS }}
          ANDROID_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          faltam=""
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_SENHA ANDROID_CHAVE_ALIAS ANDROID_CHAVE_SENHA; do
            [ -n "${!v}" ] || faltam="$faltam ${v/KEYSTORE_BASE64/ANDROID_KEYSTORE_BASE64}"
          done
          if [ -z "$faltam" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gbs-busca.jks"
            echo "ANDROID_KEYSTORE_ARQUIVO=$RUNNER_TEMP/gbs-busca.jks" >> "$GITHUB_ENV"
            echo "ASSINADO=true" >> "$GITHUB_ENV"
          else
            echo "ASSINADO=false" >> "$GITHUB_ENV"
            echo "::warning::Assinatura oficial incompleta (falta:$faltam). O APK sai assinado com uma chave de teste, diferente a cada build: para atualizar o aplicativo nos celulares sem desinstalar, cadastre os 4 secrets (README, Aplicativo Android)."
          fi

      - name: Testes, verificação e APK
        working-directory: android
        env:
          GBS_ORIGEM: ${{ vars.GBS_ORIGEM }}
          VERSAO_CODIGO: ${{ github.run_number }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_CHAVE_ALIAS: ${{ secrets.ANDROID_CHAVE_ALIAS }}
          ANDROID_CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/gbs-busca.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum gbs-busca.apk | tee gbs-busca.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gbs-busca-apk
          path: |
            gbs-busca.apk
            gbs-busca.apk.sha256

      - name: Publicar no Release "app-android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="1.0.${{ github.run_number }}"
          NOTAS="GBS Busca $VERSAO (branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}). SHA-256: $(cut -d' ' -f1 gbs-busca.apk.sha256)."
          if [ "$ASSINADO" != "true" ]; then NOTAS="$NOTAS Assinado com chave de teste: para instalar uma versão nova, desinstale a anterior."; fi
          if ! gh release view app-android >/dev/null 2>&1; then
            gh release create app-android --title "Aplicativo Android (GBS Busca)" --notes "$NOTAS" --prerelease
          else
            gh release edit app-android --notes "$NOTAS"
          fi
          gh release upload app-android gbs-busca.apk gbs-busca.apk.sha256 --clobber
