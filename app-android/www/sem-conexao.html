<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #e5e7eb;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: #9ca3af; margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; padding: 14px 22px; border-radius: 8px; border: 0; background: #f59e0b; color: #111827; }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão com o servidor</h1>
    <p>O aplicativo precisa de internet para abrir. Conecte-se (dados móveis ou Wi-Fi) e tente de novo.</p>
    <button type="button" onclick="history.back(); setTimeout(function () { location.reload(); }, 300);">TENTAR NOVAMENTE</button>
  </main>
</body>
</html>
